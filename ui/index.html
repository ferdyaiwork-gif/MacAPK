<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacAPK — Keuring voor je Mac</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner large"></div>
    <div class="loading-text">Systeemkeuring uitvoeren…</div>
</div>
<div class="error-banner" id="errorBanner"></div>

<header class="header">
    <div class="header-left">
        <div class="logo">🔧</div>
        <h1>MacAPK<small>De keuring voor je Mac</small></h1>
    </div>
    <div class="header-right">
        <button class="btn btn-secondary" onclick="toggleAuto()" id="autoBtn">⏱ Auto: Aan</button>
        <button class="btn btn-secondary" onclick="exportReport()">📄 Rapport</button>
        <button class="btn btn-primary" onclick="runCheck()" id="checkBtn">🔍 Keuring Uitvoeren</button>
    </div>
</header>

<div class="status-bar" id="statusBar">
    <span><span class="status-dot" id="statusDot"></span><span id="statusText">Verbinden…</span></span>
    <span id="lastCheck"></span>
    <span id="nextCheck"></span>
    <span id="machineInfo" style="margin-left:auto; opacity:0.7;"></span>
</div>

<div class="score-hero" id="scoreHero">
    <div class="score-circle">
        <svg viewBox="0 0 200 200">
            <circle class="bg-ring" cx="100" cy="100" r="85"/>
            <circle class="score-ring" id="scoreArc" cx="100" cy="100" r="85"
                stroke-dasharray="534" stroke-dashoffset="534" stroke="#58a6ff"/>
        </svg>
        <div class="score-value">
            <div class="score-number" id="scoreNumber">--</div>
            <div class="score-of">van 100</div>
        </div>
    </div>
    <div class="score-status" id="scoreStatus" style="color:var(--text-secondary);">WACHTEN</div>
</div>

<div class="modules-grid" id="modulesGrid">
    <div class="empty-state"><div class="icon">🔧</div><p>Wachten op eerste keuring…</p></div>
</div>

<div class="history-section">
    <div class="history-card">
        <div class="history-header">
            <h3>📈 Score Verloop</h3>
            <select class="history-select" id="historyRange" onchange="loadHistory()">
                <option value="24">Laatste 24 uur</option>
                <option value="168">Laatste 7 dagen</option>
                <option value="720">Laatste 30 dagen</option>
            </select>
        </div>
        <div class="chart-container"><canvas id="historyChart"></canvas></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
